ELECTRON_KINEMATIC_CUTS:
  - Q2 > 1
  - y < 0.85
  - W > 2

ELECTRON_FIDUCIAL_CUTS:
  - PCAL_W > 9
  - PCAL_V > 9
  - DC_region1_edge > 2.3
  - DC_region2_edge > 2.3
  - DC_region3_edge > 5.7

